name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install pinned Harbor
        run: uv sync --locked
      - name: Check source task definitions
        run: uv run python scripts/check_tasks.py --code-only
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Check code style
        run: |
          uv run ruff check scripts src tests
          uv run ruff format --check scripts src tests
      - name: Check official Harbor CLI
        run: uv run harbor run --help

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check the wheel in a clean environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/check"
          uv pip install --python "$RUNNER_TEMP/check/bin/python" dist/*.whl
          "$RUNNER_TEMP/check/bin/websitebench" --version
          test "$("$RUNNER_TEMP/check/bin/websitebench" list | wc -l)" -eq 70
          "$RUNNER_TEMP/check/bin/harbor" --version
      - name: Check the sdist contents
        run: |
          tar -tzf dist/websitebench-*.tar.gz > "$RUNNER_TEMP/sdist.txt"
          grep -q 'src/websitebench/websitebench-v1.json$' "$RUNNER_TEMP/sdist.txt"
          if grep -q '/tasks/' "$RUNNER_TEMP/sdist.txt"; then
            echo "::error::the sdist contains task files"
            exit 1
          fi
