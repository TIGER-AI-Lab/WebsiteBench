name: Code checks

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install pinned Harbor
        run: uv sync --locked
      - name: Check source task definitions
        run: uv run python scripts/check_tasks.py --code-only
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Check code style
        run: |
          uv run ruff check scripts src tests
          uv run ruff format --check scripts src tests
      - name: Check official Harbor CLI
        run: uv run harbor run --help
