name: Publish to PyPI

# Publishing a GitHub release tagged v<version> (for example v0.0.1) uploads the
# package with PyPI Trusted Publishing; no API token is stored in the repository.
# A manual run builds and checks the distributions without uploading them.
# Actions are pinned to commit SHAs; the comment names the release of each.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check the release tag against the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match v$version from pyproject.toml"
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Check the wheel in a clean environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/check"
          uv pip install --python "$RUNNER_TEMP/check/bin/python" dist/*.whl
          "$RUNNER_TEMP/check/bin/websitebench" --version
          "$RUNNER_TEMP/check/bin/websitebench" list > /dev/null
          "$RUNNER_TEMP/check/bin/harbor" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/websitebench/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
