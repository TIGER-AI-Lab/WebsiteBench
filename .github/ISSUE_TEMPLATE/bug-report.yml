name: Bug report
description: The websitebench command, the docs or CI does something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      render: shell
  - type: input
    id: version
    attributes:
      label: websitebench --version
      placeholder: websitebench 0.0.1 (tasks v1, Harbor 0.25.0)
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: macOS 15.5, Python 3.12.11
